name: Build Kernel - Mi 11 Ultra/Pro (Unified star/mars)

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel source repo'
        required: true
        default: 'pa-markakash/kernel_xiaomi_sm8350'
      KERNEL_BRANCH:
        description: 'Kernel source branch'
        required: true
        default: 'twelve'
      SUSFS_BRANCH:
        description: 'SuSFS branch (susfs4ksu)'
        required: true
        default: 'kernel-5.4'
      SUKISU_TAG:
        description: 'SukiSU Ultra tag (empty = latest main)'
        required: false
        default: ''
      USE_KPROBES:
        description: 'Use kprobes hook (false = manual, more stable)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      DISABLE_REAR_DISPLAY:
        description: 'Disable rear (secondary) display in DTS'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      SELINUX_MODE:
        description: 'SELinux mode'
        required: true
        default: 'enforcing'
        type: choice
        options:
          - 'enforcing'
          - 'permissive'

jobs:
  build:
    name: Build SukiSU Ultra Kernel (star/mars)
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      TC_DIR: ${{ github.workspace }}/toolchain
      KERNEL_DIR: ${{ github.workspace }}/kernel
      ANYKERNEL_DIR: ${{ github.workspace }}/anykernel
      OUT_DIR: ${{ github.workspace }}/out

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git \
            libelf-dev libssl-dev lld llvm make python3 \
            unzip wget zip zlib1g-dev

      - name: Clone Clang toolchain (v15)
        run: |
          mkdir -p $TC_DIR
          # Исправленная ссылка: добавлена проверка на корректное имя файла в релизе
          wget -q "https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20230520-release/Clang-15.0.7-20230520-release.tar.gz" -O $TC_DIR/clang.tar.gz
          tar -xf $TC_DIR/clang.tar.gz -C $TC_DIR
          rm $TC_DIR/clang.tar.gz
          echo "$TC_DIR/bin" >> $GITHUB_PATH

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            -b ${{ github.event.inputs.KERNEL_BRANCH }} \
            https://github.com/${{ github.event.inputs.KERNEL_SOURCE }}.git \
            $KERNEL_DIR

      - name: Detect defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          for cfg in vendor/star-qgki_defconfig vendor/lahaina-qgki_defconfig star_defconfig mars_defconfig; do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              echo "DEFCONFIG=$cfg" >> $GITHUB_ENV
              break
            fi
          done

      - name: Integrate SukiSU Ultra
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          TAG="${{ github.event.inputs.SUKISU_TAG }}"
          [ -z "$TAG" ] && TAG="main"
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${TAG}/kernel/setup.sh" | bash -s "$TAG"

      - name: Fix SukiSU for 5.4
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # Исправления для совместимости с ядром 5.4
          [ -f drivers/kernelsu/allowlist.c ] && sed -i 's/TWA_RESUME/0/g' drivers/kernelsu/allowlist.c && sed -i '1s|^|#include <linux/sched/task.h>\n|' drivers/kernelsu/allowlist.c
          [ -f drivers/kernelsu/app_profile.c ] && sed -i '/seccomp\.filter_count/d' drivers/kernelsu/app_profile.c
          [ -f drivers/kernelsu/sucompat.c ] && sed -i 's|<linux/pgtable.h>|<asm/pgtable.h>|g' drivers/kernelsu/sucompat.c && sed -i 's/strncpy_from_user_nofault/strncpy_from_user/g' drivers/kernelsu/sucompat.c

      - name: Apply SuSFS
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.SUSFS_BRANCH }} https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          cp /tmp/susfs4ksu/kernel_patches/add_susfs_in_kernel-5.4.patch . 2>/dev/null || cp /tmp/susfs4ksu/kernel_patches/*.patch . 2>/dev/null
          for p in *.patch; do patch -p1 --no-backup-if-mismatch < "$p" || patch -p1 --no-backup-if-mismatch --fuzz=3 < "$p" || true; done
          cp /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/

      - name: Patch DTS (Rear Display toggle)
        if: ${{ github.event.inputs.DISABLE_REAR_DISPLAY == 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          DTS_PATH="arch/arm64/boot/dts/qcom"
          # Твоя логика отключения через поиск файлов star/mars
          find $DTS_PATH -name "*star*.dts*" -o -name "*mars*.dts*" | xargs -I{} sh -c "printf '\n&sde_dsi1 { status = \"disabled\"; };\n&dsi_display1 { /delete-property/ qcom,dsi-display-active; };\n' >> {}"

      - name: Configure Kconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          DCFG="arch/arm64/configs/$DEFCONFIG"
          [ "${{ github.event.inputs.USE_KPROBES }}" = "true" ] && KPR="CONFIG_KSU_WITH_KPROBES=y" || KPR="# CONFIG_KSU_WITH_KPROBES is not set"
          [ "${{ github.event.inputs.SELINUX_MODE }}" = "permissive" ] && SEL="CONFIG_SECURITY_SELINUX_BOOTPARAM=y" || SEL="# CONFIG_SECURITY_SELINUX_BOOTPARAM is not set"
          
          cat <<EOF >> "$DCFG"
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_LOCALVERSION="-palaziks"
          CONFIG_LTO_NONE=y
          $KPR
          $SEL
          EOF

      - name: Build
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          mkdir -p $OUT_DIR
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=$OUT_DIR ARCH=$ARCH CC=$CC CLANG_TRIPLE=$CLANG_TRIPLE CROSS_COMPILE=$CROSS_COMPILE $DEFCONFIG
          make -j$(nproc --all) O=$OUT_DIR ARCH=$ARCH CC=$CC LD=$LD AR=$AR NM=$NM CLANG_TRIPLE=$CLANG_TRIPLE CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 Image

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $ANYKERNEL_DIR
          cp $OUT_DIR/arch/arm64/boot/Image $ANYKERNEL_DIR/
          SEL_ST="${{ github.event.inputs.SELINUX_MODE }}"
          cat <<EOF > $ANYKERNEL_DIR/anykernel.sh
          # AnyKernel3 Mod Script by @palaziks
          properties() { '
          kernel.string=SukiSU-Ultra + SuSFS | star/mars | selinux=${SEL_ST} | @palaziks
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          device.name1=star
          device.name2=mars
          device.name3=M2102K1G
          device.name4=M2102K1AC
          device.name5=M2102K1C
          supported.versions=12-14
          '; }
          block=boot; is_slot_device=1; ramdisk_compression=auto;
          . tools/ak3-core.sh; dump_boot; write_boot;
          EOF
          BUILD_DATE=$(date +%Y%m%d-%H%M)
          ZIP_NAME="SukiSU_star-mars_${SEL_ST}_${BUILD_DATE}.zip"
          cd $ANYKERNEL_DIR && zip -r9 "${GITHUB_WORKSPACE}/${ZIP_NAME}" . -x "*.git*"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ github.workspace }}/${{ env.ZIP_NAME }}
