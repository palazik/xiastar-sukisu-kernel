name: Build Kernel - Mi 11 Ultra (star) SukiSU Ultra + SuSFS

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel source repo'
        required: true
        default: 'pa-markakash/kernel_xiaomi_sm8350'
      KERNEL_BRANCH:
        description: 'Kernel source branch'
        required: true
        default: 'twelve'
      SUSFS_BRANCH:
        description: 'SuSFS branch (susfs4ksu)'
        required: true
        default: 'kernel-5.4'
      SUKISU_TAG:
        description: 'SukiSU Ultra tag (empty = latest main)'
        required: false
        default: ''
      USE_KPROBES:
        description: 'Use kprobes hook (false = manual, more stable)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      DISABLE_REAR_DISPLAY:
        description: 'Disable rear (secondary) display in DTS'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      SELINUX_MODE:
        description: 'SELinux mode'
        required: true
        default: 'enforcing'
        type: choice
        options:
          - 'enforcing'
          - 'permissive'

jobs:
  build:
    name: Build SukiSU Ultra Kernel for Mi 11 Ultra (star)
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      DEVICE: star
      DEFCONFIG: vendor/star-qgki_defconfig
      TC_DIR: ${{ github.workspace }}/toolchain
      KERNEL_DIR: ${{ github.workspace }}/kernel
      ANYKERNEL_DIR: ${{ github.workspace }}/anykernel
      OUT_DIR: ${{ github.workspace }}/out

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git \
            libelf-dev libssl-dev lld llvm make python3 \
            unzip wget zip zlib1g-dev

      - name: Clone Clang toolchain
        run: |
          mkdir -p $TC_DIR
          wget -q "https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230607-release/Clang-17.0.0-20230607.tar.gz" -O $TC_DIR/clang.tar.gz
          tar -xf $TC_DIR/clang.tar.gz -C $TC_DIR
          echo "$TC_DIR/bin" >> $GITHUB_PATH

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            -b ${{ github.event.inputs.KERNEL_BRANCH }} \
            https://github.com/${{ github.event.inputs.KERNEL_SOURCE }}.git \
            $KERNEL_DIR

      - name: Fix techpack implicit-int errors (Clang 17 compat)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # sde_hw_dsc_1_2.c - missing return type on _dsc_subblk_offset
          FILE="techpack/display/msm/sde/sde_hw_dsc_1_2.c"
          if [ -f "$FILE" ]; then
            sed -i 's/static inline _dsc_subblk_offset(/static inline int _dsc_subblk_offset(/' "$FILE"
            echo "Patched: $FILE"
          else
            echo "File not found, skipping: $FILE"
          fi
          # sde_hw_vdc.c - missing return type on _vdc_subblk_offset
          FILE="techpack/display/msm/sde/sde_hw_vdc.c"
          if [ -f "$FILE" ]; then
            sed -i 's/static inline _vdc_subblk_offset(/static inline int _vdc_subblk_offset(/' "$FILE"
            echo "Patched: $FILE"
          else
            echo "File not found, skipping: $FILE"
          fi

      - name: Detect defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # Auto-detect correct defconfig for star (Mi 11 Ultra)
          for cfg in \
              vendor/star-qgki_defconfig \
              vendor/lahaina-qgki_defconfig \
              vendor/mars_defconfig \
              star_defconfig \
              star_user_defconfig; do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              echo "Found defconfig: $cfg"
              echo "DEFCONFIG=$cfg" >> $GITHUB_ENV
              break
            fi
          done
          echo "Using defconfig: $DEFCONFIG"

      - name: Integrate SukiSU Ultra
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          TAG="${{ github.event.inputs.SUKISU_TAG }}"
          if [ -z "$TAG" ]; then TAG="main"; fi
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${TAG}/kernel/setup.sh" | bash -s "$TAG"

      - name: Fix SukiSU drivers for kernel-5.4
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # allowlist.c: TWA_RESUME not in 5.4, put_task_struct needs include
          FILE="drivers/kernelsu/allowlist.c"
          if [ -f "$FILE" ]; then
            sed -i 's/TWA_RESUME/0/g' "$FILE"
            grep -q 'linux/sched/task.h' "$FILE" || \
              sed -i '1s|^|#include <linux/sched/task.h>\n|' "$FILE"
            echo "Patched: $FILE"
          else
            echo "File not found, skipping: $FILE"
          fi
          # app_profile.c: seccomp.filter_count doesn't exist in 5.4
          FILE="drivers/kernelsu/app_profile.c"
          if [ -f "$FILE" ]; then
            sed -i '/atomic_set(&current->seccomp\.filter_count/d' "$FILE"
            sed -i '/atomic_set(&tsk->seccomp\.filter_count/d' "$FILE"
            echo "Patched: $FILE"
          else
            echo "File not found, skipping: $FILE"
          fi

      - name: Apply SuSFS (susfs4ksu)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.SUSFS_BRANCH }} \
            https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          cp /tmp/susfs4ksu/kernel_patches/add_susfs_in_kernel-*.patch . 2>/dev/null || \
            cp /tmp/susfs4ksu/kernel_patches/*.patch . 2>/dev/null
          for p in *.patch; do
            patch -p1 --no-backup-if-mismatch < "$p" || \
            patch -p1 --no-backup-if-mismatch --fuzz=3 < "$p" || \
            echo "WARNING: $p failed, continuing"
          done
          cp /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp /tmp/susfs4ksu/kernel_patches/fs/sus_su.c fs/ 2>/dev/null || true
          cp /tmp/susfs4ksu/kernel_patches/include/linux/sus_su.h include/linux/ 2>/dev/null || true

      - name: Configure hook method
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          if [ "${{ github.event.inputs.USE_KPROBES }}" = "true" ]; then
            echo "CONFIG_KSU_WITH_KPROBES=y" >> arch/arm64/configs/$DEFCONFIG
          else
            echo "# CONFIG_KSU_WITH_KPROBES is not set" >> arch/arm64/configs/$DEFCONFIG
          fi

      - name: Disable rear display in DTS
        if: ${{ github.event.inputs.DISABLE_REAR_DISPLAY == 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          DTS_DIR="arch/arm64/boot/dts/qcom"
          for f in "$DTS_DIR/lahaina-sde-display.dtsi" "$DTS_DIR/star-sde-display.dtsi" "$DTS_DIR/lahaina-star-sde-display.dtsi"; do
            [ -f "$f" ] || continue
            echo "Patching: $f"
            python3 -c "
          import re
          path = '$f'
          c = open(path).read()
          m = re.sub(r'(qcom,display-type\s*=\s*\"secondary\"[^}]*?)(^\s*qcom,dsi-display-active;\n)', r'\\1', c, flags=re.M|re.S)
          if m == c:
              lines = c.split('\n'); found = 0; out = []
              for l in lines:
                  if 'qcom,dsi-display-active' in l:
                      found += 1
                      if found > 1:
                          out.append('/* rear disabled */')
                          continue
                  out.append(l)
              m = '\n'.join(out)
          open(path, 'w').write(m)
          print('patched:', path)
          "
          done
          for f in "$DTS_DIR/lahaina-star.dts" "$DTS_DIR/lahaina-star-v2.dts" "$DTS_DIR/lahaina-star-v2-overlay.dts"; do
            [ -f "$f" ] || continue
            printf '\n/* rear display disabled */\n&sde_dsi1 { status = "disabled"; };\n&dsi_display1 { /delete-property/ qcom,dsi-display-active; };\n' >> "$f"
            echo "Patched: $f"
          done

      - name: Configure SELinux mode
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          DCFG="arch/arm64/configs/$DEFCONFIG"
          if [ "${{ github.event.inputs.SELINUX_MODE }}" = "enforcing" ]; then
            echo "SELinux: enforcing"
            sed -i 's/CONFIG_SECURITY_SELINUX_BOOTPARAM=y/# CONFIG_SECURITY_SELINUX_BOOTPARAM is not set/g' "$DCFG" || true
            sed -i '/CONFIG_SECURITY_SELINUX_DEVELOP/d' "$DCFG" || true
            sed -i 's/androidboot\.selinux=permissive//g' "$DCFG" || true
          else
            echo "SELinux: permissive"
            sed -i 's/# CONFIG_SECURITY_SELINUX_BOOTPARAM is not set/CONFIG_SECURITY_SELINUX_BOOTPARAM=y/g' "$DCFG" || true
            grep -q 'CONFIG_SECURITY_SELINUX_BOOTPARAM=y' "$DCFG" || \
              echo 'CONFIG_SECURITY_SELINUX_BOOTPARAM=y' >> "$DCFG"
            grep -q 'CONFIG_SECURITY_SELINUX_DEVELOP' "$DCFG" || \
              echo 'CONFIG_SECURITY_SELINUX_DEVELOP=y' >> "$DCFG"
          fi

      - name: Append KSU and SuSFS Kconfig to defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          DCFG="arch/arm64/configs/$DEFCONFIG"
          printf '\n# SukiSU Ultra + SuSFS\n' >> "$DCFG"
          printf 'CONFIG_KSU=y\n' >> "$DCFG"
          printf 'CONFIG_KSU_SUSFS=y\n' >> "$DCFG"
          printf 'CONFIG_KSU_SUSFS_SUS_PATH=y\n' >> "$DCFG"
          printf 'CONFIG_KSU_SUSFS_SUS_MOUNT=y\n' >> "$DCFG"
          printf 'CONFIG_KSU_SUSFS_SUS_KSTAT=y\n' >> "$DCFG"
          printf 'CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y\n' >> "$DCFG"
          printf 'CONFIG_KSU_SUSFS_TRY_UMOUNT=y\n' >> "$DCFG"
          printf 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y\n' >> "$DCFG"
          printf 'CONFIG_KSU_SUSFS_ENABLE_LOG=y\n' >> "$DCFG"
          printf 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y\n' >> "$DCFG"
          printf 'CONFIG_KSU_SUSFS_SUS_SU=y\n' >> "$DCFG"
          printf '# Kernel version branding\n' >> "$DCFG"
          printf 'CONFIG_LOCALVERSION="-palaziks"\n' >> "$DCFG"
          printf 'CONFIG_LOCALVERSION_AUTO=n\n' >> "$DCFG"
          printf 'CONFIG_BUILD_SALT="palaziks"\n' >> "$DCFG"
          printf 'CONFIG_LTO_NONE=y\n' >> "$DCFG"
          printf '# CONFIG_LTO_CLANG is not set\n' >> "$DCFG"
          echo "Kconfig entries written."

      - name: Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          mkdir -p $OUT_DIR
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER="palaziks"
          export KBUILD_BUILD_HOST="github"
          make O=$OUT_DIR ARCH=$ARCH CC=$CC CLANG_TRIPLE=$CLANG_TRIPLE CROSS_COMPILE=$CROSS_COMPILE $DEFCONFIG
          make O=$OUT_DIR ARCH=$ARCH CC=$CC CLANG_TRIPLE=$CLANG_TRIPLE CROSS_COMPILE=$CROSS_COMPILE olddefconfig
          make -j$(nproc --all) O=$OUT_DIR ARCH=$ARCH CC=$CC LD=$LD AR=$AR NM=$NM \
               OBJCOPY=$OBJCOPY OBJDUMP=$OBJDUMP STRIP=$STRIP \
               CLANG_TRIPLE=$CLANG_TRIPLE CROSS_COMPILE=$CROSS_COMPILE \
               CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
               Image 2>&1 | tee build.log
          echo "Build finished."
          echo "--- Boot artifacts ---"
          ls -lh $OUT_DIR/arch/arm64/boot/

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $ANYKERNEL_DIR

          # Copy kernel Image
          cp $OUT_DIR/arch/arm64/boot/Image $ANYKERNEL_DIR/

          # Write anykernel.sh
          REAR="${{ github.event.inputs.DISABLE_REAR_DISPLAY }}"
          SEL="${{ github.event.inputs.SELINUX_MODE }}"
          cat > $ANYKERNEL_DIR/anykernel.sh << 'AKEOF'
# AnyKernel3 Ramdisk Mod Script
# osm0sis @ xda-developers

## AnyKernel setup
properties() { '
AKEOF
          printf "kernel.string=SukiSU-Ultra + SuSFS | star | selinux=${SEL} | @palaziks\n" >> $ANYKERNEL_DIR/anykernel.sh
          cat >> $ANYKERNEL_DIR/anykernel.sh << 'AKEOF'
do.devicecheck=1
do.modules=0
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
device.name1=star
device.name2=M2102K1G
device.name3=2107113SG
supported.versions=12-14
'; } # end properties

# shell variables
block=boot;
is_slot_device=1;
ramdisk_compression=auto;

## AnyKernel methods (DO NOT CHANGE)
. tools/ak3-core.sh;

## AnyKernel install
dump_boot;
write_boot;
## end install
AKEOF

          BUILD_DATE=$(date +%Y%m%d-%H%M)
          ZIP_NAME="SukiSU-Ultra_SuSFS_star_${SEL}_${BUILD_DATE}_palaziks.zip"
          cd $ANYKERNEL_DIR
          zip -r9 ${{ github.workspace }}/$ZIP_NAME . -x "*.git*" "*.github*"
          echo "ZIP_PATH=${{ github.workspace }}/$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "Final ZIP size: $(du -sh ${{ github.workspace }}/$ZIP_NAME | cut -f1)"

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7
