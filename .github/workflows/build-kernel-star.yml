name: Build Kernel - Mi 11 Ultra/Pro (Unified star/mars)

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel source repo'
        required: true
        default: 'pa-markakash/kernel_xiaomi_sm8350'
      KERNEL_BRANCH:
        description: 'Kernel source branch'
        required: true
        default: 'twelve'
      SUSFS_BRANCH:
        description: 'SuSFS branch (susfs4ksu)'
        required: true
        default: 'kernel-5.4'
      SUKISU_TAG:
        description: 'SukiSU Ultra tag (empty = latest main)'
        required: false
        default: ''
      USE_KPROBES:
        description: 'Use kprobes hook (false = manual, more stable)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      DISABLE_REAR_DISPLAY:
        description: 'Disable rear (secondary) display in DTS'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      SELINUX_MODE:
        description: 'SELinux mode'
        required: true
        default: 'enforcing'
        type: choice
        options:
          - 'enforcing'
          - 'permissive'

jobs:
  build:
    name: Build SukiSU Ultra Kernel (star/mars)
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      TC_DIR: ${{ github.workspace }}/toolchain
      KERNEL_DIR: ${{ github.workspace }}/kernel
      ANYKERNEL_DIR: ${{ github.workspace }}/anykernel
      OUT_DIR: ${{ github.workspace }}/out

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git \
            libelf-dev libssl-dev lld llvm make python3 \
            unzip wget zip zlib1g-dev

      - name: Clone Clang toolchain (v15)
        run: |
          mkdir -p $TC_DIR
          CLANG_URL=$(curl -s https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-15-link.txt)
          wget -q "$CLANG_URL" -O $TC_DIR/clang.tar.gz
          tar -xf $TC_DIR/clang.tar.gz -C $TC_DIR
          rm $TC_DIR/clang.tar.gz
          echo "$TC_DIR/bin" >> $GITHUB_PATH

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            -b ${{ github.event.inputs.KERNEL_BRANCH }} \
            https://github.com/${{ github.event.inputs.KERNEL_SOURCE }}.git \
            $KERNEL_DIR

      - name: Detect defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          for cfg in vendor/star-qgki_defconfig vendor/lahaina-qgki_defconfig star_defconfig mars_defconfig; do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              echo "DEFCONFIG=$cfg" >> $GITHUB_ENV
              echo "Found: $cfg"
              break
            fi
          done

      - name: Fix techpack implicit-int (Clang compat)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          for f in             "techpack/display/msm/sde/sde_hw_dsc_1_2.c:_dsc_subblk_offset"             "techpack/display/msm/sde/sde_hw_vdc.c:_vdc_subblk_offset"; do
            file="${f%%:*}"; func="${f##*:}"
            [ -f "$file" ] && sed -i "s/static inline ${func}(/static inline int ${func}(/" "$file" && echo "Patched: $file"
          done

      - name: Integrate SukiSU Ultra
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          TAG="${{ github.event.inputs.SUKISU_TAG }}"
          [ -z "$TAG" ] && TAG="main"
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${TAG}/kernel/setup.sh" | bash -s "$TAG"

      - name: Fix SukiSU for kernel-5.4
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          if [ -f drivers/kernelsu/allowlist.c ]; then
            sed -i 's/TWA_RESUME/0/g' drivers/kernelsu/allowlist.c
            grep -q 'linux/sched/task.h' drivers/kernelsu/allowlist.c || \
              sed -i '1s|^|#include <linux/sched/task.h>\n|' drivers/kernelsu/allowlist.c
          fi
          [ -f drivers/kernelsu/app_profile.c ] && \
            sed -i '/seccomp\.filter_count/d' drivers/kernelsu/app_profile.c
          if [ -f drivers/kernelsu/sucompat.c ]; then
            sed -i 's|<linux/pgtable.h>|<asm/pgtable.h>|g' drivers/kernelsu/sucompat.c
            sed -i 's/strncpy_from_user_nofault/strncpy_from_user/g' drivers/kernelsu/sucompat.c
          fi
          # pkg_observer.c: fsnotify API incompatible with 5.4
          # Replace with empty stub - non-critical (only tracks app installs for allowlist)
          if [ -f drivers/kernelsu/pkg_observer.c ]; then
            echo "// pkg_observer stubbed for kernel-5.4" > drivers/kernelsu/pkg_observer.c
            echo "#include <linux/kernel.h>" >> drivers/kernelsu/pkg_observer.c
            echo "void ksu_pkg_observer_init(void) {}" >> drivers/kernelsu/pkg_observer.c
            echo "void ksu_pkg_observer_exit(void) {}" >> drivers/kernelsu/pkg_observer.c
            echo "Stubbed: drivers/kernelsu/pkg_observer.c"
          fi

      - name: Apply SuSFS
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.SUSFS_BRANCH }} \
            https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          cp /tmp/susfs4ksu/kernel_patches/add_susfs_in_kernel-5.4.patch . 2>/dev/null || \
            cp /tmp/susfs4ksu/kernel_patches/*.patch . 2>/dev/null
          for p in *.patch; do
            patch -p1 --no-backup-if-mismatch < "$p" || \
            patch -p1 --no-backup-if-mismatch --fuzz=3 < "$p" || \
            patch -p1 --no-backup-if-mismatch --fuzz=6 --ignore-whitespace < "$p" || \
            echo "WARNING: $p failed, continuing"
          done
          cp /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp /tmp/susfs4ksu/kernel_patches/fs/sus_su.c fs/ 2>/dev/null || true
          cp /tmp/susfs4ksu/kernel_patches/include/linux/sus_su.h include/linux/ 2>/dev/null || true

      - name: Patch DTS (disable rear display)
        if: ${{ github.event.inputs.DISABLE_REAR_DISPLAY == 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          DTS_PATH="arch/arm64/boot/dts/qcom"
          find $DTS_PATH -name "*star*.dts" -o -name "*mars*.dts" | while read f; do
            printf '\n/* rear display disabled by palaziks build */\n' >> "$f"
            printf '&sde_dsi1 { status = "disabled"; };\n' >> "$f"
            printf '&dsi_display1 { /delete-property/ qcom,dsi-display-active; };\n' >> "$f"
            echo "Patched DTS: $f"
          done

      - name: Configure Kconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          DCFG="arch/arm64/configs/$DEFCONFIG"
          [ "${{ github.event.inputs.USE_KPROBES }}" = "true" ] \
            && KPR="CONFIG_KSU_WITH_KPROBES=y" \
            || KPR="# CONFIG_KSU_WITH_KPROBES is not set"
          [ "${{ github.event.inputs.SELINUX_MODE }}" = "permissive" ] \
            && SEL="CONFIG_SECURITY_SELINUX_BOOTPARAM=y" \
            || SEL="# CONFIG_SECURITY_SELINUX_BOOTPARAM is not set"
          printf '%s\n' \
            '' \
            '# SukiSU Ultra + SuSFS' \
            'CONFIG_KSU=y' \
            'CONFIG_KSU_SUSFS=y' \
            'CONFIG_KSU_SUSFS_SUS_PATH=y' \
            'CONFIG_KSU_SUSFS_SUS_MOUNT=y' \
            'CONFIG_KSU_SUSFS_SUS_KSTAT=y' \
            'CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y' \
            'CONFIG_KSU_SUSFS_TRY_UMOUNT=y' \
            'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' \
            'CONFIG_KSU_SUSFS_ENABLE_LOG=y' \
            'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' \
            'CONFIG_KSU_SUSFS_SUS_SU=y' \
            '# Branding' \
            'CONFIG_LOCALVERSION="-palaziks"' \
            'CONFIG_LOCALVERSION_AUTO=n' \
            'CONFIG_LTO_NONE=y' \
            '# CONFIG_LTO_CLANG is not set' \
            "$KPR" \
            "$SEL" \
          >> "$DCFG"

      - name: Build
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          mkdir -p $OUT_DIR
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER="palaziks"
          export KBUILD_BUILD_HOST="github"
          make O=$OUT_DIR ARCH=$ARCH CC=$CC \
               CLANG_TRIPLE=$CLANG_TRIPLE CROSS_COMPILE=$CROSS_COMPILE \
               $DEFCONFIG
          make O=$OUT_DIR ARCH=$ARCH CC=$CC \
               CLANG_TRIPLE=$CLANG_TRIPLE CROSS_COMPILE=$CROSS_COMPILE \
               olddefconfig
          make -j$(nproc --all) O=$OUT_DIR ARCH=$ARCH \
               CC=$CC LD=$LD AR=$AR NM=$NM \
               OBJCOPY=$OBJCOPY OBJDUMP=$OBJDUMP STRIP=$STRIP \
               CLANG_TRIPLE=$CLANG_TRIPLE \
               CROSS_COMPILE=$CROSS_COMPILE \
               CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
               Image 2>&1 | tee build.log
          echo "--- Boot artifacts ---"
          ls -lh $OUT_DIR/arch/arm64/boot/

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $ANYKERNEL_DIR
          cp $OUT_DIR/arch/arm64/boot/Image $ANYKERNEL_DIR/
          SEL="${{ github.event.inputs.SELINUX_MODE }}"
          printf '%s\n' \
            '# AnyKernel3 Ramdisk Mod Script' \
            '# osm0sis @ xda-developers' \
            '' \
            "properties() { '" \
            "kernel.string=SukiSU-Ultra + SuSFS | star/mars | selinux=${SEL} | @palaziks" \
            'do.devicecheck=1' \
            'do.modules=0' \
            'do.systemless=1' \
            'do.cleanup=1' \
            'do.cleanuponabort=0' \
            'device.name1=star' \
            'device.name2=mars' \
            'device.name3=M2102K1G' \
            'device.name4=M2102K1AC' \
            'device.name5=M2102K1C' \
            'supported.versions=12-14' \
            "'; } # end properties" \
            '' \
            'block=boot;' \
            'is_slot_device=1;' \
            'ramdisk_compression=auto;' \
            '' \
            '. tools/ak3-core.sh;' \
            '' \
            'dump_boot;' \
            'write_boot;' \
          > $ANYKERNEL_DIR/anykernel.sh
          BUILD_DATE=$(date +%Y%m%d-%H%M)
          ZIP_NAME="SukiSU_star-mars_${SEL}_${BUILD_DATE}_palaziks.zip"
          cd $ANYKERNEL_DIR && zip -r9 "${GITHUB_WORKSPACE}/${ZIP_NAME}" . -x "*.git*"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "ZIP size: $(du -sh ${GITHUB_WORKSPACE}/${ZIP_NAME} | cut -f1)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          retention-days: 7
