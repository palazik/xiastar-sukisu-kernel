name: Compile Advanced Android Kernel (Proton Clang)

# Trigger configuration: manual launch only
on:
  workflow_dispatch:
    inputs:
      device_config:
        description: 'Select the defconfig for the target device'
        required: true
        default: 'star-qgki_defconfig'
        type: choice
        options:
          - star-qgki_defconfig
          - mars_defconfig
          - renoir-qgki_defconfig
          - odin-qgki_defconfig

jobs:
  build-kernel:
    name: Compilation Core
    runs-on: ubuntu-22.04 # Using the latest Ubuntu environment
    
    steps:
      - name: Checkout Repository Configuration
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Dynamic Memory Allocation (Swap Provisioning)
        # Critical step to prevent OOM Killer during LTO operations
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Provision Host Dependencies
        # Installing the full stack of build dependencies recommended by Proton Clang
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex gcc g++ git libelf-dev libssl-dev \
            make ninja-build python3 u-boot-tools xz-utils zlib1g-dev \
            lld llvm wget zip unzip jq tar
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Initialize and Execute Build Matrix
        env:
          # Passing the selected defconfig from GitHub Actions to the script
          DEVICE_CONFIG: ${{ inputs.device_config }}
        run: |
          chmod +x build_kernel.sh
          ./build_kernel.sh

      - name: Archive and Publish Artifacts
        # Creating an artifact containing the flashable AnyKernel3 ZIP file
        uses: actions/upload-artifact@v4
        with:
          name: Proton-Kernel-${{ inputs.device_config }}
          path: "*.zip"
          retention-days: 14
